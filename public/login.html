<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Email System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a1a;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#242424;border:1px solid #333;border-radius:12px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:20px;font-weight:700;color:#6366f1}
.logo p{font-size:13px;color:#666;margin-top:4px}
.form-group{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input{width:100%;background:#1a1a1a;border:1px solid #444;border-radius:6px;color:#e0e0e0;padding:10px 12px;font-size:14px;outline:none;transition:border-color .15s}
input:focus{border-color:#6366f1}
button{width:100%;background:#6366f1;color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .15s}
button:hover{background:#4f46e5}
button:disabled{background:#3d3d8a;cursor:not-allowed}
.error{color:#ef4444;font-size:13px;margin-top:12px;text-align:center;min-height:18px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>✉ Email System</h1>
    <p>Sign in to continue</p>
  </div>
  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Username</label>
      <input id="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button id="submit-btn" type="submit">Login</button>
    <div class="error" id="error-msg"></div>
  </form>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.error || 'Invalid credentials';
    }
  } catch {
    errEl.textContent = 'Connection error — is the server running?';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}
</script>
</body>
</html>
