<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — GTM System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:380px;padding:24px}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:48px;height:48px;background:#1e1b4b;border:1px solid #312e81;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px}
.logo h1{font-size:20px;font-weight:700;color:#f0f0f0;letter-spacing:-0.4px}
.logo p{font-size:13px;color:#666;margin-top:4px}
.card{background:#111111;border:1px solid #2a2a2a;border-radius:16px;padding:32px;box-shadow:0 8px 40px rgba(0,0,0,0.6)}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:#a0a0a0;margin-bottom:6px}
input{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:6px;color:#f0f0f0;padding:10px 13px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.12)}
input::placeholder{color:#444}
button{width:100%;background:#6366f1;color:#fff;border:1px solid #6366f1;border-radius:6px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
button:hover{background:#4f46e5;border-color:#4f46e5}
button:disabled{background:#312e81;border-color:#312e81;cursor:not-allowed;opacity:0.7}
.error{color:#fca5a5;font-size:13px;margin-top:14px;text-align:center;min-height:18px;background:#1c0000;border:1px solid #ef4444;border-radius:6px;padding:8px 12px;display:none}
.error.show{display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#444}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">✉</div>
    <h1>GTM System</h1>
    <p>Sign in to your workspace</p>
  </div>
  <div class="card">
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input id="username" type="text" autocomplete="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button id="submit-btn" type="submit">Sign In</button>
      <div class="error" id="error-msg"></div>
    </form>
  </div>
  <div class="footer">GTM Warmup &amp; Campaign System</div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.error || 'Invalid credentials';
      errEl.classList.add('show');
    }
  } catch {
    errEl.textContent = 'Connection error — is the server running?';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
